<!DOCTYPE html>
<html lang="es">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/crearGrupo.css">
    <link rel="stylesheet" href="../fonts/fonts.css">
    <title>Crear Grupo - GGchamp</title>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <button class="menu">☰</button>

        <a href="mainUsuario.html" class="link">
            <p class="logotipo">
                <span class="logotipo--GG">GG</span>champ
            </p>
        </a>

        <div class="header__nav">
            <a href="AcercaDeNosotros.html" class="header__link">Acerca de nosotros</a>
            <a href="notificaciones.html" class="header__link">Notificaciones</a>
            <a href="competencias.html" class="header__link">Competencias</a>
            <a href="rankings.html" class="header__link">rankings</a>

            <a href="perfil.html" class="avatar__link"><img class="avatar" src="../images/ui_user_profile_avatar_person_icon_208734.webp" alt=""></a>
        </div>
    </header>

    <!-- Main -->
    <main>
        <form class="group-form" action="#" method="POST">

            <!-- Título -->
            <div class="page-title">
                <button class="back" type="button">×</button>
                <h1>Crear grupo</h1>
            </div>

            <!-- Información del grupo -->
            <section class="group-info">
                <div class="group-image"></div>

                <div class="group-data">
                    <div class="form__item">
                        <label for="nombre-grupo">Nombre</label>
                        <input type="text" id="nombre-grupo" name="nombre-grupo" required>
                    </div>

                    <div class="form__item">
                        <label for="descripcion-grupo">Descripción / Mensaje</label>
                        <textarea id="descripcion-grupo" name="descripcion-grupo" required></textarea>
                    </div>
                </div>
            </section>

            <!-- Agregar usuarios -->
            <section class="users-section">
                <h2 class="section-title">Agregar usuarios</h2>

                <!-- Buscador -->
                <div class="search-user">
                    <input type="text" id="buscar-usuario" name="buscar-usuario" placeholder="Nombre de usuario">
                </div>

                <!-- Usuarios encontrados -->
                <ul class="user-list">
                    <li class="user-item">
                        <p>Nombre usuario</p>
                        <button class="add-user" type="button">+</button>
                    </li>
                    <li class="user-item">
                        <p>Nombre usuario</p>
                        <button class="add-user" type="button">+</button>
                    </li>
                    <li class="user-item">
                        <p>Nombre usuario</p>
                        <button class="add-user" type="button">+</button>
                    </li>
                </ul>
            </section>

            <!-- Usuarios agregados -->
            <section class="users-section">
                <h2 class="section-title">Usuarios agregados</h2>

                <ul class="user-list">
                    <li class="user-item">
                        <p>Nombre usuario</p>
                        <button class="remove-user" type="button">−</button>
                    </li>
                </ul>
            </section>

            <!-- Crear grupo -->
            <button class="create-group" type="submit">Crear grupo</button>

        </form>
    </main>

</body>

</html>
