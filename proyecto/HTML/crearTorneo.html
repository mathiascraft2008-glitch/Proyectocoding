<main class="main-content">

    <h1 class="title">Crear torneo</h1>
    <!-- pasos de arriba -->

    <section class="steps-container">

        <div class="step-item step-item--active">
            <div class="step-number">1</div>
            <span class="step-text">Información</span>
        </div>

        <div class="step-item">
            <div class="step-number">2</div>
            <span class="step-text">Configuración</span>
        </div>

        <div class="step-item">
            <div class="step-number">3</div>
            <span class="step-text">Revisión</span>
        </div>

    </section>

    <form class="form-container">

        <h2 class="form-title">
            Información básica
        </h2>

        <div class="form-group">

            <label for="nom">
                Nombre del torneo
            </label>

            <input
                type="text"
                id="nom"
                name="nom"
            >

        </div>


        <div class="form-group">

            <label for="format">
                Tipo de formato
            </label>

            <div class="select-wrapper">

                <select id="format" name="format">
                    <option value="suizo">
                        Suizo
                    </option>

                    <option value="eliminacion">
                        Eliminación directa
                    </option>

                    <option value="eliminacion">
                        Liga
                    </option>

                </select>

            </div>

        </div>


        <!-- disciplina-->
        <div class="form-group">

            <label for="disciplina">
                Disciplina
            </label>

            <div class="select-wrapper">

                <select id="disciplina" name="disciplina">
                    <option value="futbol">Fútbol</option>

                    <option value="basket">Básquetbol</option>

                    <option value="ajedrez">Ajedrez</option>

                </select>

            </div>

        </div>


        <!--fecha-->
        <div class="dates-row">

            <div class="form-group">

                <label for="fecha-inicio">
                    Fecha de inicio
                </label>

                <input
                    type="date"
                    id="fecha-inicio"
                    name="fecha-inicio">

            </div>


            <div class="form-group">

                <label for="fecha-final">
                    Fecha de finalizado
                </label>

                <input
                    type="date"
                    id="fecha-final"
                    name="fecha-final">

            </div>

        </div>


    <!-- lugar-->
        <div class="form-group">

            <label for="lugar">
                Lugar
            </label>

            <input
                type="text"
                id="lugar"
                name="lugar"
            >

        </div>


        <!--descripcion-->
        <div class="form-group">

            <label for="descripcion">
                Descripción
            </label>

            <textarea
                id="descripcion"
                name="descripcion"
                rows="4"
            ></textarea>

        </div>


        <!--banner -->
        <div class="form-group">

            <label for="banner">
                Imagen del banner del torneo
            </label>

            <input
                type="file"
                id="banner"
                name="banner"
                class="file-input"
            >

        </div>

        <button
            type="submit"
            class="btn-next"
        >

            <span>Siguiente</span>


        </button>

    </form>

</main>
