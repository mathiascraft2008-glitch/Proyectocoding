<!DOCTYPE html>

<html lang="es">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../CSS/detallesTorneo.css">    
<link rel="stylesheet" href="../fonts/fonts.css">

<title>Detalle del Torneo - GGchamp</title>

</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <button class="menu">☰</button>

        <a href="mainUsuario.html" class="link">
            <p class="logotipo">
                <span class="logotipo--GG">GG</span>champ
            </p>
        </a>

        <div class="header__nav">
            <a href="AcercaDeNosotros.html" class="header__link">Acerca de nosotros</a>
            <a href="notificaciones.html" class="header__link">Notificaciones</a>
            <a href="competencias.html" class="header__link">Competencias</a>
            <a href="rankings.html" class="header__link">rankings</a>

            <a href="perfil.html" class="avatar__link"><img class="avatar" src="../images/ui_user_profile_avatar_person_icon_208734.webp" alt=""></a>
        </div>
    </header>

<!-- MAIN -->
<main class="main-content">

    <!-- Imagen -->
    <div class="img"></div>

    <h1 class="tournament-title">
        Nombre Torneo
    </h1>

    <!-- Detalles -->
    <div class="tournament-card">

        <h2 class="card-section-title">
            Modalidad
        </h2>

        <!-- Disciplina y lugar -->
        <div class="form-row">

            <div class="form-group">
                <label>Disciplina</label>
                <div class="info-box"></div>
            </div>

            <div class="form-group">
                <label>Lugar</label>
                <div class="info-box"></div>
            </div>

        </div>

        <!-- Inicio y fin -->
        <div class="form-row">

            <div class="form-group">
                <label>Fecha de inicio</label>
                <div class="info-box"></div>
            </div>

            <div class="form-group">
                <label>Fecha de finalizado</label>
                <div class="info-box"></div>
            </div>

        </div>

        <h2 class="card-section-title">
            Inscripción
        </h2>

        <!-- Fecha de inscripción -->
        <div class="form-row">

            <div class="form-group">
                <label>Fecha de inicio</label>
                <div class="info-box"></div>
            </div>

            <div class="form-group">
                <label>Fecha de cierre</label>
                <div class="info-box"></div>
            </div>

        </div>

        <!-- Descripción -->
        <div class="form-group">

            <label>Descripción</label>

            <div class="info-box info-box-textarea"></div>

        </div>

        <!-- Formato -->
        <div class="form-row">

            <div class="form-group">
                <label>Tipo de participación</label>
                <div class="info-box"></div>
            </div>

            <div class="form-group">
                <label>Formato</label>
                <div class="info-box"></div>
            </div>

        </div>

        <!-- Máximo de participantes o equipos -->
        <div class="form-group">

            <label>
                Máximo de equipos/participantes
            </label>

            <div class="info-box"></div>

        </div>

        <!-- Máximo de participantes por equipo -->
        <div class="form-group">

            <label>
                Máximo de participantes por equipo (solo si es por equipos)
            </label>

            <div class="info-box"></div>

        </div>

        <h2 class="card-section-title">
            Reglas adicionales
        </h2>

        <!-- Reglas -->
        <div class="form-group full-width">

            <div class="info-box info-box-textarea"></div>

        </div>

    </div>

    <!-- Botones -->
    <div class="actions">

        <a href="" class="action-link">
            <button type="button" class="btn btn-ins">
                Inscribirse
            </button>
        </a>

        <a href="" class="action-link">
            <button type="button" class="btn btn-like">
                Seguir <span class="ico">♥</span>
            </button>
        </a>

    </div>

</main>

<!-- FOOTER -->
<footer class="footer">

    <a href="mainUsuario.html" class="link">
        <p class="logotipo">
            <span class="logotipo--GG">GG</span>champ
        </p>
    </a>

    <div class="footer__links">

        <a href="Terminos&Condiciones.html" class="link-footer">
            Términos

        <a href="AcercaDeNosotros.html" class="link-footer">
            Acerca de
        </a>

        <a href="soporte.html" class="link-footer">
            Contacto
        </a>

    </div>

    <div class="footer__bottom">

        <div class="footer__icons">
            <img class="icon-box" src="../images/instagram.png" alt="">
            <img class="icon-box" src="../images/x.png" alt="">
            <img class="icon-box" src="../images/facebook.png" alt="">
        </div>

        <p class="copyright">
            Copyright© todos los derechos reservados
        </p>

    </div>

</footer>

</body>

</html>
