<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/EditarEmparejamiento.css">
    <link rel="stylesheet" href="../fonts/fonts.css">
    <title>Editar Emparejamiento - GGchamp</title>
</head> 

<body>
    <!-- HEADER -->
    <header class="header">
        <button class="menu">☰</button>

        <a href="mainUsuario.html" class="link">
            <p class="logotipo">
                <span class="logotipo--GG">GG</span>champ
            </p>
        </a>

        <div class="header__nav">
            <a href="AcercaDeNosotros.html" class="header__link">Acerca de nosotros</a>
            <a href="notificaciones.html" class="header__link">Notificaciones</a>
            <a href="competencias.html" class="header__link">Competencias</a>
            <a href="rankings.html" class="header__link">rankings</a>

            <a href="perfil.html" class="avatar__link"><img class="avatar" src="../images/ui_user_profile_avatar_person_icon_208734.webp" alt=""></a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <h1 class="title">Editar emparejamiento</h1>

        <!-- Sección Versus -->
        <div class="versus">
            <div class="photo"><img src="" alt="Jugador 1"></div>
            <p class="versus__vs">VS</p>
            <div class="photo"><img src="" alt="Jugador 2"></div>
        </div>
        <div class="versus versus--names">
            <h2 class="versus__name">Nombre1</h2>
            <h2 class="versus__name">Nombre2</h2>
        </div>

        <!-- Resultado por ganador -->
        <div class="result result--winner">
            <h2 class="subtitle">Resultado</h2>
            <div class="result--winner-container">
                <button type="button" class="result__panel">Nombre1 Ganó</button>
                <button type="button" class="result__panel">Empate</button>
                <button type="button" class="result__panel active">Nombre2 Ganó</button>
            </div>
        </div>

        <!-- Resultado por puntos -->
        <div class="result result--points">
            <h2 class="subtitle">Puntuación</h2>
            <div class="result__inputs-container">
                <input type="number" class="result__input" name="points_player1">
                <span class="result__separator">-</span>
                <input type="number" class="result__input" name="points_player2">
            </div>
        </div>

        <!-- Resultado por sets -->
        <div class="result result--sets">
            <h2 class="subtitle">Sets</h2>
            <div class="result__inputs-container">
                <input type="number" class="result__input" name="sets_player1">
                <span class="result__separator">-</span>
                <input type="number" class="result__input" name="sets_player2">
            </div>
        </div>

        <!-- Resultado personalizado -->
        <div class="result result--custom">
            <h2 class="subtitle">Personalizado</h2>
            <div class="result__inputs-container">
                <input type="number" class="result__input" name="custom_player1">
                <span class="result__separator">-</span>
                <input type="number" class="result__input" name="custom_player2">
            </div>
        </div>

        <!-- Observaciones -->
        <div class="form-group">
            <label class="form-label" for="observaciones">Observaciones (opcional)</label>
            <textarea id="observaciones" class="textarea" placeholder="Ej: Abandono"></textarea>
        </div>

        <a href="PanelOrganizador.html" class="link-submit">
            <button class="btn-submit">Guardar cambios</button>
        </a>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <a href="mainUsuario.html" class="link"><p class="logotipo"><span class="logotipo--GG">GG</span>champ</p></a>
        <div class="footer__links">
            <a href="Terminos&Condiciones.html" class="link-footer">Términos</a>
            <a href="Terminos&Condiciones.html" class="link-footer">Privacidad</a>
            <a href="AcercaDeNosotros.html" class="link-footer">Acerca de</a>
            <a href="soporte.html" class="link-footer">Contacto</a>
        </div>
        <div class="footer__bottom">
            <div class="footer__icons">
                <img class="icon-box" src="../images/instagram.png" alt="">
                <img class="icon-box" src="../images/x.png" alt="">
                <img class="icon-box" src="../images/facebook.png" alt="">
            </div>
            <p class="copyright">Copyright© todos los derechos reservados</p>
        </div>
    </footer>
</body>

</html>
