services:

  app:
    build: .
    container_name: ggchamp-app
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ggchamp-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: GGCHAMP
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/BASE.sql:/docker-entrypoint-initdb.d/BASE.sql

volumes:
  mysql-data: